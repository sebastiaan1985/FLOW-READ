name: Snellezer app

on:
  push:
    branches: [design-snellezer, main]
    paths: ['snellezer/**', '.github/workflows/snellezer.yml']
  pull_request:
    paths: ['snellezer/**', '.github/workflows/snellezer.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snellezer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snellezer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: test -f dist/index.html && test -f dist/manifest.webmanifest && test -f dist/privacy.html && test -f dist/service-worker.js
